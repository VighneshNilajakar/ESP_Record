; PlatformIO project configuration for compile-only board verification.
;
; This file exists so a board profile can be type-checked without hardware. It
; is a *build* configuration, not a run target. See docs/support-matrix.md for
; what is and is not verified.
;
; The official PlatformIO espressif32 platform still ships Arduino-ESP32 2.x.
; For 3.x the pioarduino fork is used, because 3.x replaced driver/i2s.h with
; ESP_I2S.h and the legacy adapter is compiled out above that boundary.
;
;   pio run -e esp32cam_core2
;   pio run -e esp32_s3_core3
;
; Versions are pinned deliberately. Bump them one at a time and read the
; release notes; an unpinned "latest" turns this into silent breakage.

[platformio]
default_envs = esp32cam_core2, esp32_s3_core3

; Shared by every environment. PlatformIO applies [env] values to all of them,
; so nothing below repeats the framework or warning flags.
[env]
framework = arduino

; The repository root is also an Arduino library (it has library.properties), so
; listing it here is what compiles src/ and puts its headers on the include
; path. Without it the sketches would include headers that PlatformIO never
; builds.
lib_extra_dirs = .

; src_dir cannot be set per environment, so each environment names its sketch
; in custom_example and this script points PROJECT_SRC_DIR at it.
extra_scripts = pre:tools/pio_select_example.py

lib_deps =
build_unflags = -std=gnu++11
build_flags =
    -Wall
    -Wextra
    -std=gnu++17

; ---------------------------------------------------------- ESP32-CAM, 2.x
; The profile that has been run on hardware. AI-Thinker ESP32-CAM on the
; original ESP32 (not the S3).
[env:esp32cam_core2]
platform = espressif32@6.5.0
board = esp32cam
custom_example = examples/AIThinker_ESP32_CAM_INMP441_SDMMC

; ------------------------------------------------------- ESP32 DevKit, 2.x
[env:esp32dev_core2]
platform = espressif32@6.5.0
board = esp32dev
custom_example = examples/ESP32_I2S_SPI_SD

; ------------------------------------------------------- 3.x, via pioarduino
[esp32core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

[env:esp32dev_core3]
extends = esp32core3
board = esp32dev
custom_example = examples/ESP32_I2S_SPI_SD

[env:esp32_s3_core3]
extends = esp32core3
board = esp32-s3-devkitc-1
custom_example = examples/ESP32_S3_I2S_SPI_SD

[env:esp32_c3_core3]
extends = esp32core3
board = esp32-c3-devkitm-1
custom_example = tests/board/AdapterCompileCheck

[env:esp32_s2_core3]
extends = esp32core3
board = esp32-s2-saola-1
custom_example = tests/board/AdapterCompileCheck

[env:esp32_c6_core3]
extends = esp32core3
board = esp32-c6-devkitc-1
custom_example = tests/board/AdapterCompileCheck
