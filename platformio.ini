; PlatformIO project configuration for compile-only board verification.
;
; This file exists so a board profile can be type-checked without hardware. It
; is a *build* configuration, not a run target, and nothing here has been run on
; hardware by this project. See docs/support-matrix.md for what is and is not
; verified.
;
; The official PlatformIO espressif32 platform still ships Arduino-ESP32 2.x.
; For 3.x the pioarduino fork is used, because 3.x replaced driver/i2s.h with
; ESP_I2S.h and the legacy adapter is compiled out above that boundary.
;
;   pio run -e esp32cam_core2
;   pio run -e esp32_s3_core3
;
; Versions are pinned deliberately. Bump them one at a time and read the
; diff in the release notes; an unpinned "latest" turns this into a source of
; silent breakage.

[platformio]
default_envs = esp32cam_core2, esp32_s3_core3
src_dir = examples/AIThinker_ESP32_CAM_INMP441_SDMMC

[common]
framework = arduino
build_flags =
    -Wall
    -Wextra
    ; The recorder must never be built with brownout detection disabled: the
    ; reference profile brownouts on SD mount with a marginal USB supply and
    ; hiding that is worse than the reset.
lib_deps =

; ---------------------------------------------------------- ESP32-CAM, 2.x
; The one profile with an observed successful save. AI-Thinker ESP32-CAM on
; the original ESP32 (not the S3).
[env:esp32cam_core2]
platform = espressif32@6.5.0
board = esp32cam
framework = ${common.framework}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -std=gnu++17

[env:esp32dev_core2]
platform = espressif32@6.5.0
board = esp32dev
framework = ${common.framework}
build_flags = ${common.build_flags} -std=gnu++17

; ------------------------------------------------------- 3.x, via pioarduino
[esp32core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = ${common.framework}
build_flags = ${common.build_flags} -std=gnu++17

[env:esp32dev_core3]
board = esp32dev

[env:esp32_s3_core3]
board = esp32-s3-devkitc-1

[env:esp32_c3_core3]
board = esp32-c3-devkitm-1

[env:esp32_s2_core3]
board = esp32-s2-saola-1

[env:esp32_c6_core3]
board = esp32-c6-devkitc-1